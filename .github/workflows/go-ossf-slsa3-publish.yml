name: SLSA Go Release

on:
  workflow_dispatch:
  release:
    types:
      - created

permissions:
  contents: read

jobs:
  build:
    permissions:
      id-token: write
      contents: write
      actions: read

    uses: slsa-framework/slsa-github-generator/.github/workflows/builder_go_slsa3.yml@v2.1.0

    with:
      go-version: "1.22"