name: SLSA Generic Provenance

on:
  workflow_dispatch:

  release:
    types:
      - created

permissions:
  contents: read

env:
  ARTIFACT_NAME: "codemeet-go"

jobs:
  build:
    name: Generate Release Artifact
    runs-on: ubuntu-latest

    outputs:
      digests: ${{ steps.hash.outputs.digests }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify Go version
        run: go version

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail

          files="$(gofmt -l .)"

          if [ -n "$files" ]; then
            echo "::error::The following files are not formatted:"
            echo "$files"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test -v ./...

      - name: Run race detector
        run: go test -race ./...

      - name: Build
        run: go build -v ./...

      - name: Create source archive
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME}"

          git archive \
            --format=tar.gz \
            --output="${ARTIFACT_NAME}-${VERSION}.tar.gz" \
            "${GITHUB_SHA}"

          echo "Created artifact:"
          ls -lh "${ARTIFACT_NAME}-${VERSION}.tar.gz"

      - name: Generate provenance subjects
        id: hash
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME}"
          ARTIFACT="${ARTIFACT_NAME}-${VERSION}.tar.gz"

          sha256sum "${ARTIFACT}" > checksums.txt

          DIGESTS="$(sha256sum "${ARTIFACT}" | base64 -w0)"

          echo "digests=${DIGESTS}" >> "${GITHUB_OUTPUT}"

          echo "Generated checksums:"
          cat checksums.txt

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}-${{ github.ref_name }}
          path: |
            ${{ env.ARTIFACT_NAME }}-${{ github.ref_name }}.tar.gz
            checksums.txt
          if-no-files-found: error

  provenance:
    name: Generate SLSA Provenance
    needs:
      - build

    permissions:
      actions: read
      id-token: write
      contents: write

    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0

    with:
      base64-subjects: "${{ needs.build.outputs.digests }}"
      upload-assets: true
