name: SLSA Generic Provenance

on:
  workflow_dispatch:

  release:
    types:
      - created

permissions:
  contents: read

jobs:
  build:
    name: Generate Release Artifact
    runs-on: ubuntu-latest

    outputs:
      digests: ${{ steps.hash.outputs.digests }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify Go version
        run: go version

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Check formatting
        shell: bash
        run: |
          files="$(gofmt -l .)"

          if [ -n "$files" ]; then
            echo "::error::The following files are not formatted:"
            echo "$files"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...

      - name: Run race detector
        run: go test -race ./...

      - name: Create source archive
        run: |
          git archive \
            --format=tar.gz \
            --output="codemeet-go-${GITHUB_REF_NAME}.tar.gz" \
            "${GITHUB_SHA}"

      - name: Generate provenance subjects
        id: hash
        shell: bash
        run: |
          set -euo pipefail

          sha256sum \
            "codemeet-go-${GITHUB_REF_NAME}.tar.gz" \
            > checksums.txt

          echo "digests=$(sha256sum \
            "codemeet-go-${GITHUB_REF_NAME}.tar.gz" \
            | base64 -w0)" >> "${GITHUB_OUTPUT}"

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: checksums.txt

  provenance:
    name: Generate SLSA Provenance
    needs:
      - build

    permissions:
      actions: read
      id-token: write
      contents: write

    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0

    with:
      base64-subjects: "${{ needs.build.outputs.digests }}"
      upload-assets: true
